[project]
name = "ads-model-maker"
version = "0.1.0"
description = "AI Model Making Toolkit - Train custom models from your data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Afterdark Solutions", email = "dev@afterdarktech.com"}
]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Custom model building
    "einops>=0.7.0",
    "tiktoken>=0.5.0",

    # Data processing
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",

    # Document processing
    "pdfplumber>=0.10.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "unstructured>=0.11.0",

    # OCR
    "pytesseract>=0.3.10",
    "pillow>=10.1.0",
    "opencv-python-headless>=4.8.0",

    # NLP
    "tokenizers>=0.15.0",
    "sentencepiece>=0.1.99",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",

    # Task queue
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Storage
    "boto3>=1.34.0",
    "oci>=2.118.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "httpx>=0.26.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
]

huggingface = [
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.42.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ads_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
